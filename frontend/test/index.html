<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Miko AI Factory - Story Test</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 32px;
        }

        .subtitle {
            margin-bottom: 20px;
            font-size: 16px;
        }

        .status {
            padding: 12px;
            border-radius: 8px;
            background: #eef2ff;
            margin-bottom: 20px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            resize: vertical;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            margin-top: 15px;
            padding: 13px 22px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: wait;
        }

        pre {
            margin-top: 20px;
            padding: 20px;
            background: #111827;
            color: #e5e7eb;
            border-radius: 10px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 80px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>🐱 Miko AI Factory</h1>

        <div class="subtitle">
            Story Engine V1 Test
        </div>

        <div class="status">

            Worker:
            <strong>
                miko-ai-factory.side-gs78.workers.dev
            </strong>

        </div>

        <label for="idea">
            Story Idea
        </label>

        <textarea id="idea">Miko menemukan bunga kecil yang hampir layu di taman dan mencoba menolongnya.</textarea>

        <button id="generateBtn">
            ✨ Generate Story
        </button>

        <pre id="result">Hasil akan muncul di sini...</pre>

    </div>

</div>


<script>

const API_URL =
    "https://miko-ai-factory.side-gs78.workers.dev/api/story/generate";


const button =
    document.getElementById("generateBtn");

const ideaInput =
    document.getElementById("idea");

const result =
    document.getElementById("result");


button.addEventListener("click", async () => {

    const idea =
        ideaInput.value.trim();


    if (!idea) {

        result.textContent =
            "Masukkan story idea terlebih dahulu.";

        return;
    }


    button.disabled = true;

    button.textContent =
        "Generating...";

    result.textContent =
        "Menghubungi Miko Story Engine...";


    try {

        const response =
            await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    project_id:
                        "MIKO-0001",

                    idea:
                        idea,

                    language:
                        "id-ID",

                    duration:
                        45

                })

            });


        const data =
            await response.json();


        result.textContent =
            JSON.stringify(
                data,
                null,
                2
            );


    } catch (error) {

        result.textContent =
            "ERROR:\n\n" +
            error.message;

    } finally {

        button.disabled = false;

        button.textContent =
            "✨ Generate Story";

    }

});

</script>

</body>

</html>
