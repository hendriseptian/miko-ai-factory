<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Miko AI Factory - Scene Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        textarea {
            width: 100%;
            min-height: 420px;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
        }

        button {
            margin-top: 15px;
            padding: 13px 22px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: wait;
        }

        pre {
            margin-top: 20px;
            padding: 20px;
            background: #111827;
            color: #e5e7eb;
            border-radius: 10px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>🎬 Miko Scene Engine</h1>

        <p>
            Story → Production Scene Test
        </p>

        <textarea id="storyInput"></textarea>

        <button id="processBtn">
            🎬 Process Scenes
        </button>

        <pre id="result">Hasil akan muncul di sini...</pre>

    </div>

</div>

<script>

const API_URL =
    "https://miko-ai-factory.side-gs78.workers.dev/api/scene/process";

const storyInput =
    document.getElementById("storyInput");

const button =
    document.getElementById("processBtn");

const result =
    document.getElementById("result");


const sampleStory = {
    project_id: "MIKO-0001",
    title: "Miko dan Bunga Kecil",
    language: "id-ID",
    duration_target: 45,

    scenes: [

        {
            scene_id: "SCENE-01",
            sequence: 1,
            duration: 5,
            location: "Rainbow Park",
            characters: ["Miko"],
            action:
                "Miko berjalan dengan ceria di taman bunga lalu berhenti melihat sebuah bunga kecil.",
            dialogue:
                "Wah, hari yang cerah!",
            narration:
                "Miko sedang bermain di taman yang indah.",
            image_prompt: "",
            video_prompt: "",
            reference_assets: [
                "MIKO_MASTER_BIBLE",
                "Rainbow Park"
            ],
            image_status: "PENDING",
            video_status: "PENDING"
        },

        {
            scene_id: "SCENE-02",
            sequence: 2,
            duration: 8,
            location: "Rainbow Park",
            characters: ["Miko"],
            action:
                "Miko berlutut dan melihat bunga kecil berwarna kuning yang terkulai.",
            dialogue:
                "Eh? Kenapa bunganya menunduk?",
            narration:
                "Miko melihat sebuah bunga kecil yang hampir layu.",
            image_prompt: "",
            video_prompt: "",
            reference_assets: [
                "MIKO_MASTER_BIBLE"
            ],
            image_status: "PENDING",
            video_status: "PENDING"
        },

        {
            scene_id: "SCENE-03",
            sequence: 3,
            duration: 12,
            location: "Rainbow Park",
            characters: ["Miko"],
            action:
                "Miko mengambil penyiram tanaman kecil lalu menyiram bunga dengan hati-hati.",
            dialogue:
                "Tunggu sebentar ya, aku ambilkan air!",
            narration:
                "Miko mengambil air untuk menolong bunga itu.",
            image_prompt: "",
            video_prompt: "",
            reference_assets: [
                "MIKO_MASTER_BIBLE"
            ],
            image_status: "PENDING",
            video_status: "PENDING"
        },

        {
            scene_id: "SCENE-04",
            sequence: 4,
            duration: 10,
            location: "Rainbow Park",
            characters: ["Miko"],
            action:
                "Bunga kecil perlahan kembali tegak dan segar. Miko tersenyum lega.",
            dialogue:
                "Hore! Bunganya sudah segar lagi!",
            narration:
                "Perlahan, bunga itu kembali segar.",
            image_prompt: "",
            video_prompt: "",
            reference_assets: [
                "MIKO_MASTER_BIBLE"
            ],
            image_status: "PENDING",
            video_status: "PENDING"
        },

        {
            scene_id: "SCENE-05",
            sequence: 5,
            duration: 10,
            location: "Rainbow Park",
            characters: ["Miko"],
            action:
                "Miko duduk di samping bunga yang sudah segar dan melambaikan tangan ke kamera.",
            dialogue:
                "Menolong itu menyenangkan!",
            narration:
                "Merawat makhluk hidup adalah hal yang baik.",
            image_prompt: "",
            video_prompt: "",
            reference_assets: [
                "MIKO_MASTER_BIBLE"
            ],
            image_status: "PENDING",
            video_status: "PENDING"
        }

    ]
};


storyInput.value =
    JSON.stringify(sampleStory, null, 2);


button.addEventListener("click", async () => {

    button.disabled = true;
    button.textContent = "Processing...";
    result.textContent =
        "Mengirim Story JSON ke Scene Engine...";

    try {

        const story = JSON.parse(
            storyInput.value
        );

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                story: story
            })

        });

        const data =
            await response.json();

        result.textContent =
            JSON.stringify(
                data,
                null,
                2
            );

    } catch (error) {

        result.textContent =
            "ERROR:\n\n" +
            error.message;

    } finally {

        button.disabled = false;
        button.textContent =
            "🎬 Process Scenes";

    }

});

</script>

</body>
</html>
